name: Validar Zord
on:
  push:
    branches: [main]
    paths:
      - "custom_addons/**"
      - "scripts/**"
      - "config/**"
      - "tests/**"
      - ".github/workflows/ci-zord.yml"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  qualidade:
    runs-on: ubuntu-24.04
    steps:
      - name: Obter codigo
        uses: actions/checkout@v5
      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Conferir sintaxe
        run: python -m compileall -q custom_addons/zord_brand scripts/marca-zord.py
      - name: Testes de configuracao pt-BR / BRL
        run: python -m unittest discover -s tests -p 'test_zord_*.py' -v
