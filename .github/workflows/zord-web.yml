name: Zord Web CI

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/zord-web.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/zord-web.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zord-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualidade:
    name: Next.js · lint, tipagem, testes e build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/web
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Instalar dependências
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund 2>&1 | tee /tmp/zord-npm.log
          else
            npm install --no-audit --no-fund 2>&1 | tee /tmp/zord-npm.log
          fi
          if grep -Ei '(^npm warn|deprecated|unsupported engine)' /tmp/zord-npm.log; then
            echo "Falha: a instalação produziu advertências."
            exit 1
          fi
      - name: ESLint sem warnings
        run: npm run lint
      - name: TypeScript estrito
        run: npm run typecheck
      - name: Testes de validação e segurança
        run: npm run test
      - name: Build de produção Next.js
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee /tmp/zord-build.log
          if grep -Ei '(^.*warning:|^warn|^⚠|deprecated)' /tmp/zord-build.log; then
            echo "Falha: a compilação gerou advertências."
            exit 1
          fi
      - name: Registrar lockfile após validação
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          if git status --porcelain -- package-lock.json | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(web): fixar dependências após CI aprovado"
            git push origin HEAD:main
          fi
